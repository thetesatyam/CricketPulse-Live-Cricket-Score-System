# Test Profile Configuration (H2 In-Memory Database)
spring.application.name=cricketpulse-backend-test

spring.datasource.url=jdbc:h2:mem:cricketpulse_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

cricketpulse.jwt.secret=9a3f9e8b2c4d6a8e0f1b3d5c7e9a1b3d5e7f9a1b3c5d7e9f1a3b5c7d9e1f3a5
cricketpulse.jwt.expiration-ms=3600000

cricketpulse.simulation.default-interval-ms=100
cricketpulse.simulation.deterministic=true
