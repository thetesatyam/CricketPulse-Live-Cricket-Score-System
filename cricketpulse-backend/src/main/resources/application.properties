# CricketPulse Application Configuration
spring.application.name=cricketpulse-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration (XAMPP Default)
spring.datasource.url=jdbc:mysql://localhost:3306/cricketpulse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JWT Security Configuration
cricketpulse.jwt.secret=${CRICKETPULSE_JWT_SECRET}
cricketpulse.jwt.expiration-ms=86400000

# CORS Configuration
cricketpulse.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Match Simulation Settings
cricketpulse.simulation.default-interval-ms=2000
cricketpulse.simulation.deterministic=false

# External Cricket Data Provider (Configurable Adapter)
cricketpulse.provider.enabled=false
cricketpulse.provider.type=simulation
cricketpulse.provider.api-key=${CRICKETPULSE_PROVIDER_API_KEY:}
cricketpulse.provider.base-url=https://api.cricapi.com/v1
cricketpulse.provider.timeout-ms=5000

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


